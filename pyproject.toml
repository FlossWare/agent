[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ai"
version = "0.1.0"
description = "FlossWare provider-neutral agent execution and orchestration — worker/arbiter architecture for software engineering and general agent workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Scot P. Floess", email = "sfloess@gmail.com"},
]
keywords = ["ai", "agent", "flossware", "model-routing", "agent-orchestration", "worker", "arbiter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "model-router-ai @ git+https://github.com/FlossWare/model-router-ai.git",
    "resilience-ai @ git+https://github.com/FlossWare/resilience-ai.git",
    "structured-output-ai @ git+https://github.com/FlossWare/structured-output-ai.git",
]

[project.optional-dependencies]
all = [
    "consensus-ai @ git+https://github.com/FlossWare/consensus-ai.git",
    "evaluation-ai @ git+https://github.com/FlossWare/evaluation-ai.git",
    "observability-ai @ git+https://github.com/FlossWare/observability-ai.git",
    "security-ai @ git+https://github.com/FlossWare/security-ai.git",
    "workflow-ai @ git+https://github.com/FlossWare/workflow-ai.git",
]
tui = [
    "curses-themes @ git+https://github.com/FlossWare/curses-themes.git",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
pa = "personal_agent.cli:main"

[project.urls]
Repository = "https://github.com/FlossWare/agent-ai"

[tool.setuptools.packages.find]
include = ["personal_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
