[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ai"
version = "0.1.0"
description = "FlossWare provider-neutral agent execution and orchestration with worker/arbiter workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Scot P. Floess", email = "sfloess@gmail.com"},
]
keywords = ["ai", "agent", "flossware", "model-routing", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "model-router-ai @ git+https://github.com/FlossWare/model-router.git@6c159fecc94ebd9e6e8e8ae32a8f7ab57693202f",
    "resilience-ai @ git+https://github.com/FlossWare/resilience.git@b4a11f80bfe4b9a879b95b724d143d92cb548c47",
    "structured-output-ai @ git+https://github.com/FlossWare/structured-output.git@9584f13877afa60307a9f9bca950caef0ff3b542",
]

[project.optional-dependencies]
all = [
    "consensus-ai @ git+https://github.com/FlossWare/consensus.git@8a7c76893b76b26e097dffe4db578b64f0238996",
    "evaluation-ai @ git+https://github.com/FlossWare/evaluation.git@790d56dfb87c704a215253c94ee97408cc3dba51",
    "observability-ai @ git+https://github.com/FlossWare/observability.git@f2bf65b8d2318594727d6e7641eba897b07f201a",
    "security-ai @ git+https://github.com/FlossWare/security.git@7a19820af85af14818773ba579e42d8943654365",
    "workflow-ai @ git+https://github.com/FlossWare/workflow.git@cba80a46a95d28b3076200c82a7eb67c1273670f",
]
tui = [
    "curses-tui @ git+https://github.com/FlossWare/curses-tui.git@84458a18ae4c47a9f31d7233f5a6cf565c0c2c1f",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
pa = "personal_agent.cli:main"

[project.urls]
Repository = "https://github.com/FlossWare/agent"

[tool.setuptools.packages.find]
include = ["personal_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
